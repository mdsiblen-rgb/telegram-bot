<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Protidin Kaj BD</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:sans-serif;background:#eef7f1}.page{display:none}.page.active{display:block}</style></head><body>
<div id="loginScreen" class="fixed inset-0 bg-[#0a1a18] z-[99] flex items-center justify-center p-4">
<div class="bg-white rounded-[20px] p-5 w-full max-w-[360px]">
<div class="text-center"><div class="w-16 h-16 bg-[#0f6d5e] rounded-full mx-auto flex items-center justify-center text-white text-2xl font-bold">৳</div><h1 class="font-bold text-xl mt-2">প্রতিদিনের কাজ</h1></div>
<div id="joinBox" class="mt-4"><input id="j_name" placeholder="নাম: SHIBLI NOMAN" class="w-full border-2 p-3 rounded-xl mt-2"><input id="j_user" placeholder="@username: @ShibliNoman_BD" class="w-full border-2 p-3 rounded-xl mt-2"><input id="j_pass" type="password" placeholder="পাসওয়ার্ড: 1234" class="w-full border-2 p-3 rounded-xl mt-2"><input id="j_cpass" type="password" placeholder="পাসওয়ার্ড আবার" class="w-full border-2 p-3 rounded-xl mt-2"><button onclick="doJoin()" class="w-full mt-4 bg-[#0f6d5e] text-white py-3 rounded-xl font-bold">🚀 একাউন্ট তৈরি করুন</button><p class="text-center text-sm mt-2" onclick="showLogin()">আগে একাউন্ট আছে? <b class="text-green-700">লগিন</b></p></div>
<div id="loginBox" class="hidden mt-4"><input id="l_user" placeholder="@username" class="w-full border-2 p-3 rounded-xl mt-2"><input id="l_pass" type="password" placeholder="পাসওয়ার্ড" class="w-full border-2 p-3 rounded-xl mt-2"><button onclick="doLogin()" class="w-full mt-4 bg-[#0f6d5e] text-white py-3 rounded-xl font-bold">✅ লগিন করুন</button><p class="text-center text-sm mt-2" onclick="showJoin()">নতুন? <b class="text-green-700">একাউন্ট তৈরি</b></p></div>
<div id="welcomeBox" class="hidden text-center mt-4"><p class="font-bold text-green-600">✅ সফল! ব্যালেন্স ৳50</p><button onclick="enterApp()" class="w-full mt-3 bg-black text-white py-3 rounded-xl">অ্যাপসে প্রবেশ করুন</button></div>
</div></div>

<div id="appScreen" class="hidden"><div class="bg-[#0f6d5e] text-white p-4 flex justify-between"><span id="hName">User</span><span>৳<span class="bal">50</span></span></div>
<div id="p-home" class="page active p-4"><div class="grid grid-cols-2 gap-3"><button onclick="switchPage('balance')" class="bg-white p-4 rounded-xl font-bold">💳 Balance</button><button onclick="switchPage('withdraw')" class="bg-white p-4 rounded-xl font-bold">🏧 Withdraw</button><button onclick="switchPage('refer')" class="bg-white p-4 rounded-xl font-bold">🔗 Refer</button><button onclick="switchPage('task')" class="bg-white p-4 rounded-xl font-bold">✅ Task</button><button onclick="switchPage('profile')" class="bg-white p-4 rounded-xl font-bold col-span-2">👤 Profile</button></div>
<div id="p-balance" class="page p-4"><div class="bg-white p-5 rounded-xl">💳 Balance: ৳<span class="bal">50</span><br><button onclick="switchPage('home')" class="mt-3 bg-green-700 text-white px-4 py-2 rounded">Back</button></div></div>
<div id="p-withdraw" class="page p-4"><div class="bg-white p-5 rounded-xl">🏧 Withdraw - Min 100 Tk<br><button onclick="switchPage('home')" class="mt-3 bg-green-700 text-white px-4 py-2 rounded">Back</button></div></div>
<div id="p-refer" class="page p-4"><div class="bg-white p-5 rounded-xl">🔗 Refer Link: t.me/ProtidinerKajBD<br>প্রতি রেফার 5 Tk<br><button onclick="switchPage('home')" class="mt-3 bg-green-700 text-white px-4 py-2 rounded">Back</button></div></div>
<div id="p-task" class="page p-4"><div class="bg-white p-5 rounded-xl">✅ Community Task<br><button onclick="window.open('https://t.me/ProtidinerKajBD')" class="bg-green-700 text-white px-4 py-2 rounded mt-2">Join Channel</button><br><button onclick="switchPage('home')" class="mt-3 bg-black text-white px-4 py-2 rounded">Back</button></div></div>
<div id="p-profile" class="page p-4"><div class="bg-white p-5 rounded-xl">👤 Profile<br><span id="pName"></span><br><button onclick="logout()" class="mt-3 bg-red-600 text-white px-4 py-2 rounded">Logout</button><br><button onclick="switchPage('home')" class="mt-3 bg-green-700 text-white px-4 py-2 rounded">Back</button></div></div>
</div>

<script>
function showLogin(){joinBox.classList.add('hidden');loginBox.classList.remove('hidden')}
function showJoin(){loginBox.classList.add('hidden');joinBox.classList.remove('hidden')}
function doJoin(){let n=j_name.value,u=j_user.value,p=j_pass.value,cp=j_cpass.value;if(!n||!u||!p){alert('সব পূরণ করুন');return}if(p!=cp){alert('পাসওয়ার্ড মিলেনি');return}localStorage.setItem('u',JSON.stringify({n:n,u:u,p:p,b:50}));joinBox.classList.add('hidden');welcomeBox.classList.remove('hidden');hName.innerText=n;pName.innerText=n;document.querySelectorAll('.bal').forEach(e=>e.innerText=50)}
function doLogin(){let u=l_user.value,p=l_pass.value;let s=JSON.parse(localStorage.getItem('u')||'null');if(s&&s.u==u&&s.p==p){loginBox.classList.add('hidden');welcomeBox.classList.remove('hidden');hName.innerText=s.n}else{alert('ভুল ইউজার/পাসওয়ার্ড')}}
function enterApp(){loginScreen.classList.add('hidden');appScreen.classList.remove('hidden')}
function switchPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('p-'+id).classList.add('active')}
function logout(){localStorage.clear();location.reload()}
</script></body></html>
