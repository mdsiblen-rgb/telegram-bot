<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Task</title>
<style>
 body{background:#fff;color:#000 !important;text-align:center;padding:20px;font-family:sans-serif}
 .task-btn{background:#0088cc;color:#fff;padding:15px 30px;border:none;border-radius:12px;font-size:18px;width:90%}
</style>
</head>
<body>
<h2>Daily Task</h2>
<p>নিচের বাটনে ক্লিক করে Ad টি 15 সেকেন্ড দেখুন</p>
<button class="task-btn" onclick="claimTask()">Task Claim - Earn 50 Points</button>
<p id="status"></p>

<script>
 const AD_LINK = "https://omg10.com/4/11760259";
 function claimTask(){
   document.getElementById('status').innerText="Ad খুলছে... Back করুন";
   window.open(AD_LINK, "_blank");
   setTimeout(()=>{ document.getElementById('status').innerText="✅ 50 Points Added!"; }, 5000);
 }
</script>
</body>
</html>
