<!DOCTYPE html>
<html lang="bn">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Community Task Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{max-width:430px;margin:0 auto;background:#f2f5f4;min-height:100vh;padding-bottom:80px}
.top{background:#0f6f66;color:#fff;padding:12px 14px;display:flex;justify-content:space-between}
.top .u{display:flex;gap:10px;align-items:center}
.top img{width:42px;height:42px;background:#fff;border-radius:50%}
.balBox{background:#0f6f66;color:#fff;text-align:center;padding:30px 10px 35px;border-radius:0 0 28px 28px}
.balBox h1{font-size:62px;margin:10px 0;font-weight:800}
.balBox p{opacity:.9}
.form{margin:16px;background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 15px rgba(0,0,0,.05)}
.form input{width:100%;padding:16px;border:1.5px solid #111;border-radius:14px;margin-bottom:12px;font-size:15px;outline:none}
.form input:last-of-type{border-color:#ddd}
.form button{width:100%;padding:16px;border-radius:14px;border:none;background:#d0d3d6;color:#333;font-weight:bold;font-size:16px}
.form button.active{background:#0f6f66;color:#fff}
.form .note{color:red;text-align:center;font-size:13px;margin-top:10px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #eee}
.nav button{border:none;background:none;font-size:12px;color:#777}.nav button.on{color:#0f6f66;font-weight:bold}
</style>
</head>
<body>

<div class="top">
<div class="u"><img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"><div><b>SHIBLI NOMAN</b><br><small>৳ <span id="b1">340.00</span></small></div></div>
<div>✓</div>
</div>

<div class="balBox">
<p>আপনার ব্যালেন্স</p><h1>৳ <span id="b2">340.00</span></h1>
<p>বাকি: ৳<span id="need">660</span> | মিনিমাম ১০০০</p>
</div>

<div class="form">
<input id="num" placeholder="bKash / Nagad Number">
<input id="amt" type="number" placeholder="Amount">
<button id="wdBtn">ব্যালেন্স কম - 340 আছে</button>
<div class="note">১০০০ টাকার কমে উইথড্র হবে না</div>
</div>

<div class="nav">
<button onclick="location.href='#'">🏠<br>হোম</button>
<button class="on">💳<br>উইথড্র</button>
<button>❓<br>সাপোর্ট</button>
<button>👤<br>প্রোফাইল</button>
</div>

<script>
let bal=parseFloat(localStorage.getItem('bal')||'340');
function up(){
 document.getElementById('b1').innerText=bal.toFixed(2);
 document.getElementById('b2').innerText=bal.toFixed(2);
 document.getElementById('need').innerText=(1000-bal>0?1000-bal:0).toFixed(0);
 let btn=document.getElementById('wdBtn');
 btn.innerText='ব্যালেন্স কম - '+bal.toFixed(0)+' আছে';
 if(bal>=1000){btn.classList.add('active'); btn.innerText='✅ উইথড্র করুন';}
 localStorage.setItem('bal',bal);
}
up();
document.getElementById('wdBtn').onclick=function(){
 if(bal<1000){alert('আপনার ব্যালেন্স '+bal+' টাকা। ১০০০ হলে উইথড্র হবে।'); return;}
 let n=document.getElementById('num').value; let a=document.getElementById('amt').value;
 if(!n||!a){alert('নাম্বার ও টাকা লিখুন');return;}
 alert(a+' টাকা '+n+' এ পাঠানো হয়েছে!');
};
</script>
</body>
</html>
