<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:sans-serif;text-align:center;padding:20px;background:#f5f5f5}
.box{background:white;padding:25px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,0.1)}
.btn{padding:15px 30px;font-size:18px;background:#00a651;color:white;border:none;border-radius:10px;width:100%;margin-top:15px}
</style>
</head>
<body>
<div class="box">
<h2>🏢 Company Official App</h2>
<p>টাস্ক কমপ্লিট করে ইনকাম শুরু করো</p>
<button class="btn" onclick="alert('টাস্ক সম্পন্ন হয়েছে!')">💲 টাস্ক সম্পন্ন করুন</button>
<button class="btn" style="background:#0088cc" onclick="Telegram.WebApp.openLink('https://t.me/')">📢 টেলিগ্রাম জয়েন</button>
<p style="color:green;margin-top:20px">✅ Status: Active</p>
</div>
<script>
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
</script>
</body>
</html>
