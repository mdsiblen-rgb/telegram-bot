<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Protidiner Kaj BD - Official</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{max-width:430px;margin:0 auto;background:#f0fdfa;padding-bottom:90px}#loading{position:fixed;inset:0;background:#0f766e;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;color:#fff;transition:.5s}#loading.hide{opacity:0;pointer-events:none}.spinner{width:50px;height:50px;border:4px solid rgba(255,255,255,.3);border-top:4px solid #fff;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}@keyframes spin{to{transform:rotate(360deg)}}#bonusPop{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:1000}#bonusPop.on{display:flex}.bonusBox{background:#fff;border-radius:24px;padding:22px;width:85%;max-width:340px;text-align:center}.top{background:#0f766e;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}.top img{width:44px;height:44px;border-radius:50%;background:#fff;padding:2px;object-fit:cover}.tab{display:none}.tab.on{display:block}.btm{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;display:flex;justify-content:space-around;padding:8px 0 10px;border-top:1px solid #e2e8f0;z-index:30}.btm button{border:none;background:none;font-size:11px;color:#64748b;cursor:pointer}.btm button.on{color:#0f766e;font-weight:bold}#adModal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:99;color:#fff}
