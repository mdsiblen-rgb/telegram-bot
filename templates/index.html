<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protidiner Kaj - Pro Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:Hind Siliguri,sans-serif;background:#0f172a}
.page{display:none} .page.active{display:block}
button:active{transform:scale(0.97)}
</style>
</head>
<body class="text-white min-h-screen pb-20">
<div class="max-w-md mx-auto bg-slate-900 min-h-screen">
<!-- Header -->
<div class="p-4 bg-gradient-to-r from-violet-600 to-indigo-600 flex justify-between items-center">
<div><h1 class="font-bold text-lg">Protidiner Kaj BD</h1><p class="text-xs opacity-80">YT: @MdSible-k7o</p></div>
<div class="bg-white text-violet-700 px-3 py-1 rounded-full text-sm font-bold">৳ <span id="balance">350</span></div>
</div>

<!-- Pages -->
<div id="home" class="page active p-4">
<div class="bg-slate-800 rounded-2xl p-4 mt-2">
<h2 class="font-bold text-xl">স্বাগতম! 👋</h2>
<p class="text-sm text-slate-300 mt-1">প্রতিদিন কাজ করে আয় করুন। সব বাটন ১০০% কাজ করবে।</p>
<div class="grid grid-cols-2 gap-3 mt-4">
<button onclick="showPage('earn')" class="bg-violet-600 p-4 rounded-xl">💰 আয় করুন</button>
<button onclick="showPage('withdraw')" class="bg-emerald-600 p-4 rounded-xl">💸 উইথড্র</button>
</div>
<button onclick="window.open('https://t.me/ProtidinerKajBD')" class="w-full mt-3 bg-sky-600 py-3 rounded-xl font-bold">📢 চ্যানেল জয়েন করুন</button>
</div>
</div>

<div id="earn" class="page p-4">
<h2 class="font-bold text-lg">আয় করুন</h2>
<div class="bg-slate-800 rounded-xl p-4 mt-3">
<p class="text-sm">বিজ্ঞাপন দেখে আয়</p>
<button onclick="watchAd()" class="w-full mt-2 bg-violet-600 py-3 rounded-xl">▶️ Ad দেখুন +৳20</button>
</div>
<div class="bg-slate-800 rounded-xl p-4 mt-3">
<p class="text-sm">YouTube Subscribe</p>
<button onclick="doTask('subscribe')" class="w-full mt-2 bg-red-600 py-3 rounded-xl">🔔 Subscribe +৳30</button>
</div>
</div>

<div id="withdraw" class="page p-4">
<h2 class="font-bold text-lg">উইথড্র</h2>
<div class="bg-slate-800 rounded-xl p-4 mt-3">
<input id="number" placeholder="bKash/Nagad Number" class="w-full p-3 rounded-lg bg-slate-700 text-white outline-none">
<input id="amount" type="number" placeholder="Amount (Min 500)" class="w-full p-3 rounded-lg bg-slate-700 mt-2 outline-none">
<div class="grid grid-cols-2 gap-2 mt-3">
<button onclick="withdraw('bKash')" class="bg-pink-600 py-3 rounded-xl font-bold">bKash</button>
<button onclick="withdraw('Nagad')" class="bg-orange-600 py-3 rounded-xl font-bold">Nagad</button>
</div>
<p id="wmsg" class="text-xs mt-2 text-emerald-400"></p>
</div>
</div>

<div id="support" class="page p-4">
<h2 class="font-bold">সাপোর্ট</h2>
<div class="bg-slate-800 rounded-xl p-4 mt-3 text-sm text-slate-300">সমস্যা হলে @MdSible-k7o তে মেসেজ দিন। Channel: @ProtidinerKajBD</div>
<button onclick="window.open('https://t.me/ProtidinerKajBD')" class="w-full mt-3 bg-sky-600 py-3 rounded-xl">💬 সাপোর্টে মেসেজ</button>
</div>

<div id="profile" class="page p-4">
<h2 class="font-bold">প্রোফাইল</h2>
<div class="bg-slate-800 rounded-xl p-4 mt-3"><p id="pname">User</p><p class="text-xs text-slate-400">ID: <span id="pid"></span></p></div>
</div>

<!-- Bottom Nav -->
<div class="fixed bottom-0 max-w-md w-full bg-slate-800 border-t border-slate-700 flex justify-around py-2">
<button onclick="showPage('home')" class="text-center text-xs">🏠<br>হোম</button>
<button onclick="showPage('earn')" class="text-center text-xs">💰<br>আয়</button>
<button onclick="showPage('withdraw')" class="text-center text-xs">💸<br>উইথড্র</button>
<button onclick="showPage('support')" class="text-center text-xs">🎧<br>সাপোর্ট</button>
<button onclick="showPage('profile')" class="text-center text-xs">👤<br>প্রোফাইল</button>
</div>
</div>

<script>
let bal=350;
const tg=window.Telegram.WebApp; tg.ready(); tg.expand();
if(tg.initDataUnsafe.user){document.getElementById('pname').innerText=tg.initDataUnsafe.user.first_name; document.getElementById('pid').innerText=tg.initDataUnsafe.user.id}

function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active')}

function watchAd(){bal+=20; updateBal(); alert('Ad দেখা হয়েছে! +৳20 যোগ হয়েছে');}
function doTask(t){bal+=30; updateBal(); window.open('https://youtube.com/@MdSible-k7o'); alert('Task Done! +৳30');}
function updateBal(){document.getElementById('balance').innerText=bal}
function withdraw(m){let a=document.getElementById('amount').value; let n=document.getElementById('number').value; if(!n||!a){document.getElementById('wmsg').innerText='Number ও Amount দিন'; return} if(a<500){document.getElementById('wmsg').innerText='মিনিমাম ৳500'; return} document.getElementById('wmsg').innerText=m+' এ ৳'+a+' রিকোয়েস্ট পাঠানো হয়েছে!';}
</script>
</body>
</html>
