<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protidin Kaj BD</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center;padding:20px}
.card{background:#1e293b;padding:20px;border-radius:15px;margin-top:20px}
input{width:90%;padding:12px;border-radius:8px;border:none;margin:10px 0}
button{width:95%;padding:13px;background:#38bdf8;color:black;font-weight:bold;border:none;border-radius:10px;font-size:16px}
button:active{background:#0ea5e9}
.menu button{margin:5px 0;background:#334155;color:white}
</style>
</head>
<body>
<h2>💼 প্রতিদিন কাজ BD</h2>

<div id="loginDiv" class="card">
<h3>লগইন করুন</h3>
<input id="phone" placeholder="বিকাশ নাম্বার দিন (01xxxxxxxxx)">
<button id="loginBtn">✅ লগইন করুন</button>
<p id="msg"></p>
</div>

<div id="mainDiv" class="card" style="display:none">
<h3 id="welcome"></h3>
<p>💰 ব্যালেন্স: <span id="balance">0</span> টাকা</p>
<div class="menu">
<button onclick="alert('Balance: '+localStorage.getItem('balance'))">💰 Balance</button>
<button onclick="alert('Withdraw 100 টাকা হলে পাবেন')">💳 Withdraw</button>
<button onclick="shareRefer()">🔗 Refer Link</button>
<button onclick="window.open('https://t.me/ProtidinerKaj_BD','_blank')">🌐 Community Task</button>
</div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// যদি আগে লগইন করা থাকে
if(localStorage.getItem('phone')){
  showMain();
}

document.getElementById('loginBtn').addEventListener('click', function(){
  let phone = document.getElementById('phone').value;
  if(phone.length < 11){
    document.getElementById('msg').innerText = "❌ সঠিক নাম্বার দিন";
    return;
  }
  localStorage.setItem('phone', phone);
  if(!localStorage.getItem('balance')) localStorage.setItem('balance', '50');
  document.getElementById('msg').innerText = "✅ লগইন সফল!";
  setTimeout(showMain, 800);
});

function showMain(){
  document.getElementById('loginDiv').style.display='none';
  document.getElementById('mainDiv').style.display='block';
  document.getElementById('welcome').innerText = "স্বাগতম: " + localStorage.getItem('phone');
  document.getElementById('balance').innerText = localStorage.getItem('balance');
}

function shareRefer(){
  let link = "https://t.me/ProtidinKaj_BD_Bot?start=" + localStorage.getItem('phone');
  navigator.clipboard.writeText(link);
  alert("রেফার লিংক কপি হয়েছে:\n" + link);
}
</script>
</body>
</html>
