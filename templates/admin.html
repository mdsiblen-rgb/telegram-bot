<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel Final</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{max-width:500px;margin:0 auto;background:#f1f5f9;padding:12px}input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin:6px 0 12px}button{width:100%;padding:14px;border:none;border-radius:12px;background:#0f766e;color:#fff;font-weight:bold;cursor:pointer;margin-top:8px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0}#login{position:fixed;inset:0;background:#0f766e;display:flex;align-items:center;justify-content:center;z-index:99}#login div{background:#fff;padding:24px;border-radius:18px;width:90%;max-width:350px;text-align:center}</style></head><body>
<div id="login"><div><h2>🔐 Admin Login</h2><p style="font-size:12px">Pass: Sibli@2026BD</p><input id="pass" type="password" placeholder="Password"><button onclick="check()">Login</button></div></div>
<h2 style="text-align:center">⚙️ FINAL ADMIN PANEL</h2>
<div class="card" style="border:2px solid #0f766e;background:#fffbeb"><b>🔑 স্থায়ী পাস: Sibli@2026BD</b><input id="newPass" type="text" placeholder="নতুন পাসওয়ার্ড"><button onclick="changePass()" style="background:#f59e0b">পাসওয়ার্ড বদলাও</button></div>
<div class="card"><h3 style="color:#0f766e">💰 টাকা সেটিং</h3>🎁 Join Bonus<input id="bonusAmt" type="number">📺 প্রতি বিজ্ঞাপন<input id="adAmt" type="number">▶ YouTube<input id="ytAmt" type="number">✈ Telegram<input id="tgAmt" type="number">👥 রেফার<input id="refAmt" type="number">🏦 মিনিমাম উইথড্র<input id="wdMin" type="number"></div>
<div class="card"><h3>🔗 লিংক</h3>Channel<input id="chLink">Bot<input id="botLink">YouTube<input id="ytLink">Ref<input id="refBase"></div>
<div class="card"><h3>📢 নোটিশ</h3><textarea id="notice" rows="5"></textarea></div>
<div class="card"><h3>🖼️ ছবি</h3>Banner1<input id="b1img">Banner2<input id="b2img">Top<input id="topImg"></div>
<button onclick="save()">✅ সব সেভ করো</button><a href="/"><button style="background:#64748b">🏠 হোম</button></a>
<script>
const PERM="Sibli@2026BD";function getPass(){return localStorage.getItem('adminPass')||PERM}
function check(){let p=document.getElementById('pass').value;if(p===getPass()||p===PERM){document.getElementById('login').style.display='none';load();}else{alert('ভুল! '+getPass())}}
function load(){let c=JSON.parse(localStorage.getItem('siteConfig')||'{}');document.getElementById('bonusAmt').value=c.bonusAmt||150;document.getElementById('adAmt').value=c.adAmt||20;document.getElementById('ytAmt').value=c.ytAmt||20;document.getElementById('tgAmt').value=c.tgAmt||10;document.getElementById('refAmt').value=c.refAmt||110;document.getElementById('wdMin').value=c.wdMin||1000;document.getElementById('chLink').value=c.chLink||'https://t.me/ProtidinerKajBD';document.getElementById('botLink').value=c.botLink||'https://t.me/ProtidinerKaj_BD_Bot';document.getElementById('ytLink').value=c.ytLink||'https://www.youtube.com/@MdSible-k7o';document.getElementById('refBase').value=c.refBase||'https://t.me/ProtidinerKaj_BD_Bot?start=880775';document.getElementById('notice').value=c.notice||'';document.getElementById('b1img').value=c.b1img||'';document.getElementById('b2img').value=c.b2img||'';document.getElementById('topImg').value=c.topImg||'';}
function save(){let c={bonusAmt:document.getElementById('bonusAmt').value,adAmt:document.getElementById('adAmt').value,ytAmt:document.getElementById('ytAmt').value,tgAmt:document.getElementById('tgAmt').value,refAmt:document.getElementById('refAmt').value,wdMin:document.getElementById('wdMin').value,chLink:document.getElementById('chLink').value,botLink:document.getElementById('botLink').value,ytLink:document.getElementById('ytLink').value,refBase:document.getElementById('refBase').value,notice:document.getElementById('notice').value,b1img:document.getElementById('b1img').value,b2img:document.getElementById('b2img').value,topImg:document.getElementById('topImg').value};localStorage.setItem('siteConfig',JSON.stringify(c));alert('✅ সেভ! Bonus '+c.bonusAmt+' টাকা।')}
function changePass(){let np=document.getElementById('newPass').value.trim();if(np.length<4){alert('4+ দাও');return}localStorage.setItem('adminPass',np);alert('নতুন: '+np)}
</script></body></html>
