<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>body{font-family:sans-serif;background:#f1f5f9;padding:12px}.card{background:#fff;padding:14px;border-radius:14px;margin-bottom:12px}input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;margin-bottom:8px}img{width:100%;max-height:180px;object-fit:contain;border-radius:10px;display:none}.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;color:#fff;background:#0f766e}</style></head><body><script>if(prompt("Password")!="Sibli@2026BD"){document.body.innerHTML="Wrong";throw""}function R(i,im){let f=i.files[0];let r=new FileReader();r.onload=e=>{let x=document.getElementById(im);x.src=e.target.result;x.style.display="block"};r.readAsDataURL(f)}function S(){let o={};["youtube","ref","notice","bkash","nagad","rocket"].forEach(k=>o[k]=document.getElementById(k).value);["profile","banner1","banner2","top"].forEach(k=>o[k]=document.getElementById("i_"+k).src);localStorage.setItem("siteConfig",JSON.stringify(o));alert("Saved")}function L(){let c=JSON.parse(localStorage.getItem("siteConfig")||"{}");for(let k in c){let e=document.getElementById(k);if(e)e.value=c[k];let im=document.getElementById("i_"+k);if(im&&c[k].startsWith("data:")){im.src=c[k];im.style.display="block"}}}</script><div class="card"><b>YouTube</b><input id="youtube"><b>Ref</b><input id="ref"><b>Notice</b><textarea id="notice"></textarea></div><div class="card"><b>ছবি আপলোড - Choose File এ ক্লিক করো</b><br>Profile<img id="i_profile"><input type="file" accept="image/*" onchange="R(this,'i_profile')"><br>Banner1<img id="i_banner1"><input type="file" accept="image/*" onchange="R(this,'i_banner1')"><br>Banner2<img id="i_banner2"><input type="file" accept="image/*" onchange="R(this,'i_banner2')"><br>Top<img id="i_top"><input type="file" accept="image/*" onchange="R(this,'i_top')"></div><div class="card"><b>bKash Nagad Rocket</b><input id="bkash" placeholder="bKash Number"><input id="nagad" placeholder="Nagad Number"><input id="rocket" placeholder="Rocket Number"></div><button class="btn" onclick="S()">Save All</button><script>L()</script></body></html>
