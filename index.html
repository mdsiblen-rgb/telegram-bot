<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Protidiner Kaj BD</title>
<style>
body{margin:0;background:#f0f2f5;font-family:sans-serif;padding-bottom:70px}
.top{background:#00b894;color:#fff;padding:12px;display:flex;justify-content:space-between}
.box{background:#fff;margin:10px;padding:14px;border-radius:12px;box-shadow:0 2px 5px #0001}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-weight:bold;font-size:15px}
.g{background:#00b894;color:#fff}.b{background:#0984e3;color:#fff}.y{background:#fdcb6e}
.page{display:none}.page.active{display:block}
.nav{position:fixed;bottom:0;left:0;width:100%;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #ddd}
.nav div{font-size:12px;text-align:center;cursor:pointer}
</style></head><body>

<div class="top"><b>Protidiner Kaj BD</b><span id="adB" style="background:#ff7675;padding:4px 10px;border-radius:20px;font-size:12px">Ad: 20</span></div>
<div class="box" style="display:flex;justify-content:space-around;text-align:center"><div>ব্যালেন্স<br><b id="bal">20 TK</b></div><div>মোট<br><b id="tbal" style="color:#00b894">20 TK</b></div></div>

<div id="p-home" class="page active">
<div class="box"><button id="adBtn" class="btn g" onclick="watchAd()">🎬 বিজ্ঞাপন দেখুন - 2 TK</button><p id="adT" style="font-size:11px;text-align:right">20/20 বাকি</p></div>
<div class="box"><b>🔗 রেফার লিংক</b><div onclick="copyR()" style="background:#dfe6e9;padding:10px;border-radius:8px;margin-top:8px;word-break:break-all;text-align:center"><span id="rLink">Loading...</span></div><button class="btn y" style="margin-top:10px" onclick="copyR()">📤 কপি করুন</button></div>
</div>

<div id="p-tasks" class="page"><div class="box"><h3>🎯 টাস্ক</h3><button class="btn b" onclick="doTask()">🎁 ডেইলি চেক-ইন - 5 TK</button><button class="btn g" style="margin-top:10px" onclick="watchAd()">🎬 Ad দেখুন - 2 TK</button></div></div>
<div id="p-invite" class="page"><div class="box" style="text-align:center"><h1>10 TK</h1><p>প্রতি রেফারে</p><div style="background:#dfe6e9;padding:10px;border-radius:8px;margin-top:10px"><span id="rLink2"></span></div></div></div>
<div id="p-wallet" class="page"><div class="box"><h3>💰 ওয়ালেট - <span id="bal2">20 TK</span></h3><select id="method" style="width:100%;padding:10px"><option>bKash</option><option>Nagad</option></select><input id="num" placeholder="নাম্বার" style="width:100%;padding:10px;margin-top:8px"><input id="amt" placeholder="Amount" style="width:100%;padding:10px;margin-top:8px"><button class="btn g" style="margin-top:10px" onclick="wd()">Withdraw</button></div></div>
<div id="p-profile" class="page"><div class="box" style="text-align:center"><img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" style="width:70px;border-radius:50%"><h3>Riyad Ahmed</h3><p>ID: 8807178385</p></div></div>

<div class="nav">
<div onclick="go('home')">🏠<br>Home</div>
<div onclick="go('tasks')">🎯<br>Tasks</div>
<div onclick="go('invite')">👥<br>Invite</div>
<div onclick="go('wallet')">💰<br>Wallet</div>
<div onclick="go('profile')">👤<br>Profile</div>
</div>

<script>
// তোমার কোম্পানির Ad লিংক
var AD_LINK = "https://omg10.com/4/11760259";
var bal = 20; var adLeft = 20;
var balEl = document.getElementById('bal');

function go(p){
  var pages = document.querySelectorAll('.page');
  for(var i=0;i<pages.length;i++){pages[i].classList.remove('active')}
  document.getElementById('p-'+p).classList.add('active');
}
function watchAd(){
  if(adLeft<=0){alert('আজকের লিমিট শেষ');return}
  var btn = document.getElementById('adBtn');
  window.open(AD_LINK, "_blank");
  btn.innerHTML = "অপেক্ষা করুন 6s...";
  btn.disabled = true;
  var c = 6;
  var t = setInterval(function(){
    c--; btn.innerHTML = "অপেক্ষা "+c+"s...";
    if(c<=0){clearInterval(t); finishAd()}
  },1000);
}
function finishAd(){
  bal+=2; adLeft--;
  document.getElementById('bal').innerText = bal+" TK";
  document.getElementById('bal2').innerText = bal+" TK";
  document.getElementById('tbal').innerText = bal+" TK";
  document.getElementById('adB').innerText = "Ad: "+adLeft;
  document.getElementById('adT').innerText = adLeft+"/20 বাকি";
  document.getElementById('adBtn').innerText = "🎬 বিজ্ঞাপন দেখুন - 2 TK";
  document.getElementById('adBtn').disabled = false;
  alert("2 TK যোগ হয়েছে!");
}
function doTask(){bal+=5; document.getElementById('bal').innerText=bal+" TK"; alert("5 TK Bonus!")}
function copyR(){var l=document.getElementById('rLink').innerText; navigator.clipboard.writeText(l); alert("কপি হয়েছে: "+l)}
function wd(){alert("Withdraw Request পাঠানো হয়েছে!")}
document.getElementById('rLink').innerText="https://t.me/ProtidinerKaj_BD_Bot?start=8807178385";
document.getElementById('rLink2').innerText="https://t.me/ProtidinerKaj_BD_Bot?start=8807178385";
</script></body></html>
